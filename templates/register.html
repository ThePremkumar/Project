{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}

<style>
  .auth-bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 80% 50%, rgba(139,92,246,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 30%, rgba(0,212,255,0.06) 0%, transparent 60%);
  }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .auth-wrap { width:100%; max-width:430px; position:relative; z-index:1; }
  .auth-logo-ring {
    width:72px; height:72px;
    background: linear-gradient(135deg, var(--purple), var(--accent));
    border-radius: 20px;
    display: inline-flex; align-items:center; justify-content:center;
    font-size:30px; color:white;
    box-shadow: 0 8px 32px rgba(139,92,246,0.45);
    margin-bottom: 18px;
  }
  .auth-card {
    background: rgba(15, 27, 53, 0.85);
    border: 1px solid rgba(139,92,246,.2);
    border-radius: 18px;
    padding: 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,.5);
  }
  .strength-bar { height:3px; border-radius:2px; background:var(--border); overflow:hidden; margin-top:6px; }
  .strength-fill { height:100%; border-radius:2px; transition: width .3s, background .3s; }
  .req-check { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:4px; }
  .req-check.ok { color:var(--green); }
</style>

<div class="auth-bg"></div>
<div class="auth-wrap">
  <div style="text-align:center; margin-bottom:28px;">
    <div class="auth-logo-ring"><i class="fas fa-user-shield"></i></div>
    <h4 style="font-weight:800; font-size:22px; letter-spacing:-.5px;">Create Account</h4>
    <p style="color:var(--muted2); font-size:13px; margin-top:5px;">Join the CyberSentinel platform</p>
  </div>

  <div class="auth-card">
    <div style="font-size:11px; font-weight:700; color:var(--purple); text-transform:uppercase; letter-spacing:.12em; margin-bottom:22px; display:flex; align-items:center; gap:8px;">
      <i class="fas fa-user-plus"></i> New Analyst Registration
    </div>

    <form method="POST" id="reg-form">
      <div style="margin-bottom:16px;">
        <label class="input-label">Username</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input type="text" name="username" id="reg-user" required placeholder="Min. 3 characters"
            class="cyber-input" autocomplete="username" oninput="checkUser(this)">
        </div>
        <div class="req-check" id="user-req"><i class="fas fa-circle-dot"></i> At least 3 characters</div>
      </div>
      <div style="margin-bottom:16px;">
        <label class="input-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" name="password" id="reg-pw" required placeholder="Enter a strong password"
            class="cyber-input" autocomplete="new-password" oninput="checkStrength(this)">
          <button type="button" onclick="togglePw('reg-pw', this)"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
        <div id="strength-label" style="font-size:10px;margin-top:4px;color:var(--muted)"></div>
      </div>
      <div style="margin-bottom:24px;">
        <label class="input-label">Confirm Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock-open input-icon"></i>
          <input type="password" name="confirm" id="reg-confirm" required placeholder="Re-enter password"
            class="cyber-input" autocomplete="new-password" oninput="checkMatch()">
        </div>
        <div class="req-check" id="match-req"><i class="fas fa-circle-dot"></i> Passwords must match</div>
      </div>
      <button type="submit" class="btn-cyber-solid w-100" id="reg-btn"
        style="background:linear-gradient(135deg,var(--purple),var(--accent));justify-content:center;font-size:14px;padding:12px;">
        <i class="fas fa-user-shield"></i> Create Account
      </button>
    </form>

    <div style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent);font-weight:600;">Sign in</a>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}
function checkUser(inp) {
  const el = document.getElementById('user-req');
  if (inp.value.length >= 3) { el.className='req-check ok'; el.innerHTML='<i class="fas fa-circle-check"></i> Looks good!'; }
  else { el.className='req-check'; el.innerHTML='<i class="fas fa-circle-dot"></i> At least 3 characters'; }
}
function checkStrength(inp) {
  const v = inp.value, fill = document.getElementById('strength-fill'), lbl = document.getElementById('strength-label');
  let s = 0;
  if (v.length >= 8) s++;
  if (/[A-Z]/.test(v)) s++;
  if (/[0-9]/.test(v)) s++;
  if (/[^A-Za-z0-9]/.test(v)) s++;
  const map = [[0,'0%','var(--border)',''], [1,'25%','var(--red)','Weak'], [2,'50%','var(--amber)','Fair'], [3,'75%','var(--accent)','Good'], [4,'100%','var(--green)','Strong']];
  const [,w,c,t] = map[s];
  fill.style.width = w; fill.style.background = c;
  lbl.textContent = t; lbl.style.color = c;
}
function checkMatch() {
  const el = document.getElementById('match-req');
  const pw = document.getElementById('reg-pw').value;
  const cf = document.getElementById('reg-confirm').value;
  if (cf && pw === cf) { el.className='req-check ok'; el.innerHTML='<i class="fas fa-circle-check"></i> Passwords match!'; }
  else { el.className='req-check'; el.innerHTML='<i class="fas fa-circle-dot"></i> Passwords must match'; }
}
document.getElementById('reg-form').addEventListener('submit', function(e) {
  const pw = document.getElementById('reg-pw').value;
  const cf = document.getElementById('reg-confirm').value;
  if (pw !== cf) { e.preventDefault(); alert('Passwords do not match.'); return; }
  const btn = document.getElementById('reg-btn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';
  btn.disabled = true;
});
</script>
{% endblock %}
