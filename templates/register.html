{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="width:64px;height:64px;background:var(--accent);border-radius:16px;
           display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:var(--bg);margin-bottom:16px;">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h4 style="color:var(--text);font-weight:700;margin:0;">Create Account</h4>
      <p style="color:var(--muted);font-size:13px;margin-top:4px;">Join the CyberSentinel platform</p>
    </div>
    <div class="cyber-card">
      <h6 style="color:var(--accent);margin-bottom:20px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;">
        <i class="fas fa-user-plus me-2"></i>New Analyst Account
      </h6>
      <form method="POST">
        <div class="mb-3">
          <label style="font-size:12px;color:var(--muted);margin-bottom:6px;display:block;">Username</label>
          <div style="position:relative;">
            <i class="fas fa-user" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;"></i>
            <input type="text" name="username" required minlength="3" placeholder="Choose username"
              style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
                     padding:10px 12px 10px 36px;color:var(--text);font-size:13px;outline:none;"
              onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
          </div>
        </div>
        <div class="mb-4">
          <label style="font-size:12px;color:var(--muted);margin-bottom:6px;display:block;">Password</label>
          <div style="position:relative;">
            <i class="fas fa-lock" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;"></i>
            <input type="password" name="password" required placeholder="Choose password"
              style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
                     padding:10px 12px 10px 36px;color:var(--text);font-size:13px;outline:none;"
              onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
          </div>
        </div>
        <button type="submit" class="btn-cyber-solid w-100">
          <i class="fas fa-user-plus me-2"></i>Create Account
        </button>
      </form>
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent);">Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
